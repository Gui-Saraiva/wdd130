<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fale conosco">
    <meta name="author" content="Guilherme Fagundes Saraiva">
    <title>Contato | Corredeiras Rafting</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/corredeiras-logo.png" alt="corredeiras logotipo">        
        <nav>
            <ul class="navegacao">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>        
        <header>
            <h1 class="titulo-contato">Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>info@correiras.com</p>
        </header>

        <section>
            <div class="google">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d117271.47805188884!2d-47.757030573798914!3d-23.289124431790782!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1785619057593!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="formulario">
                <form action="">
                    <div class="nome">
                        <label class="txt-nome" for="nome">Nome</label>
                        <input class="input-form" type="text" name="nome" id="nome">
                    </div>

                    <div class="email">
                        <label class="txt-nome" for="e-mail">E-mail:</label>
                        <input class="input-form" type="email" name="e-mail" id="e-mail">
                    </div>
                    
                        <div class="prop-msg">
                            <div class="form prop-radio">
                                <label for="msg">Propósito da Mensagem</label>
                            </div>

                            <div class="form-radio">
                                <div class="radio">
                                    <input type="radio" name="msg" id="msg">
                                    <label for="msg">Dúvida Geral</label>
                                </div>

                                <div class="radio">
                                    <input type="radio" name="msg" id="msg">
                                    <label for="msg">Pergunta sobre Reserva</label>
                                </div>

                                <div class="radio">
                                    <input type="radio" name="msg" id="msg">
                                    <label for="msg">Sugestão</label>
                                </div>
                        </div>
                    </div>

                    <div class="mensagem">
                        <label for="txt-msg">Mensagem</label>
                        <textarea name="txt-msg" id="txt-msg"></textarea>
                    </div>

                    <div class="check">
                        <input type="checkbox" name="checkbox" id="checkbox">
                        <label for="checkbox">Por favor, me inscreva na newsletter mensal</label>
                    </div>

                    <button type="submit">Entrar em Contato!</button>
                </form>
            </div>
        </section>

        <footer>
            <div>
                <h1 class="titulo-contato">Estamos Aqui para Serví-lo</h1>
            </div>
            <div class="imagens">
                <figure>
                    <div class="img">
                        <img src="imagens/funcionario-1.png" alt="imagem funcionário">
                        <figcaption>Guilherme</figcaption>
                    </div>

                    <div class="img">
                        <img src="imagens/funcionario-2.png" alt="imagem funcionario" srcset="">
                        <figcaption>Maria</figcaption>
                    </div>

                    <div class="img">
                        <img src="imagens/funcionario-3.png" alt="imagem funcionario" srcset="">
                        <figcaption>Angela</figcaption>
                    </div>
                </figure>
            </div>
        </footer>
    </main>

    <footer>
        <p>&copy; 2026 - Corredeiras Rafting - Guilherme Saraiva</p>
        <nav class="socialmedia">            
            <a href="https://facebook.com">
                <img src="imagens/logo_facebook.jpg" alt="logotipo facebook">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/logo_instagram.jpg" alt="logotipo instagram">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/logo_linkedin.jpg" alt="logotipo linkedin">
            </a>
        </nav>
    </footer>
</body>

</html>
