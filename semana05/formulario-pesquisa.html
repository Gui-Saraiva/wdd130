<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Usuários</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <h2>WDD130 | Formulário HTML - Pesquisa de Usuário</h2>
        </div>
    </header>

    <main>
        
        <form>
            <fieldset>
                <legend>Informações de contato:</legend>
                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>

                <div class="item-formulario coluna2">
                    <label for="e-mail">e-mail:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Perguntas:</legend>
                <div class="item-formulario coluna1">
                    <label for="quantidade">Qual seu navegador favorito?</label>
                    <select name="navegador" id="navegador"> <!-- abre uma seta para clicar e escolher opções -->
                        <option value="1">Chrome</option>
                        <option value="2">Edge</option>
                        <option value="3">Opera</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um bichinho de estimação?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="item-formulario">
                    <label class="titulo" for="feedback">Liste os lugares que você morou:</label>
                    <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Flórida, Amsterdã Holanda, Tibuktu Mali"></textarea>
                </div>
            </fieldset>
            
            <div class="button">
                <button type="submit">Enviar Pesquisa</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Formulário HTML - Guilherme Saraiva</p>
    </footer>
</body>
</html>
